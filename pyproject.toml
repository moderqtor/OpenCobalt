[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencobalt"
version = "0.1.0"
description = "Personal control layer for allocating intelligence and capability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
memory = [
    "mem0ai",
]
server = [
    "fastapi>=0.100",
    "httpx>=0.27",
    "uvicorn>=0.20",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]
shell = [
    "watchdog>=4.0",
]
codex = [
    "openai-codex>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[project.scripts]
opencobalt = "opencobalt.cli:app"
opencobalt-broker = "opencobalt.agent_broker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["src/opencobalt"]
